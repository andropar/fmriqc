<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}fMRI QA Report{% endblock %}</title>
    <style>
{{ css_content|safe }}
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <footer>
        fmriqa v{{ version }}
        <a href="https://github.com/your-repo/fmriqa">Documentation</a>
    </footer>

    <!-- D3.js -->
    <script>
{{ d3_content|safe }}
    </script>
    <!-- Charts -->
    <script>
{{ charts_content|safe }}
    </script>
    <!-- Main -->
    <script>
{{ main_content|safe }}
    </script>
    <!-- Threshold Controls -->
    {% if threshold_controls_content %}
    <script>
{{ threshold_controls_content|safe }}
    </script>
    {% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
